  <g id="text_26">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(125.130391 321.584737)">One build per variant. Both include quantizer training and encoding. Original API includes native I/O; current API is in memory.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(191.515938 331.662769)">Query-ready time adds current input loading or original index/metadata reload. Warm file cache.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(187.087656 341.7408)">Historical run: one NUMA socket, no interleave; these are not 64-thread/interleave measurements.</text>
